<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <!-- Link para o arquivo CSS de estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho principal do site -->
  <header class="header">
    <h1>Boletim Digital</h1>
    <p>8º Ano - Estudante Exemplo</p>
  </header>

  <main class="container">
    
    <!-- Seção dos Cards de Resumo -->
    <section class="cards-grid">
      <div class="card card-purple">
        <h3>Média Geral</h3>
        <p id="card-media">—</p>
      </div>

      <div class="card card-pink">
        <h3>Total de Faltas</h3>
        <p id="card-faltas">—</p>
      </div>

      <div class="card card-purple">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-desempenho">—</p>
      </div>

      <div class="card card-pink">
        <h3>Precisam de Atenção</h3>
        <p id="card-atencao">—</p>
      </div>

      <div class="card card-purple">
        <h3>Frequência Geral</h3>
        <p>92%</p>
        <span class="subtext">Frequência adequada</span>
      </div>
    </section>

    <!-- Seção da Tabela de Disciplinas -->
    <section class="table-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <!-- O JavaScript preencherá as linhas aqui automaticamente -->
        <tbody id="tabela-corpo"></tbody>
      </table>
    </section>

  </main>

  <!-- Link para o arquivo JavaScript -->
  <script src="script.js"></script>
</body>
</html>
